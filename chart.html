<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매출 분석 차트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 라이트 모드 */
        body.light-mode {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* 다크 모드 */
        body.dark-mode {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1000;
        }

        .toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
        }

        body.light-mode .header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e90ff 0%, #00c853 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        body.light-mode .back-link {
            color: #1e90ff;
            background: rgba(30, 144, 255, 0.1);
        }

        body.dark-mode .back-link {
            color: #4db8ff;
            background: rgba(77, 184, 255, 0.1);
        }

        .back-link:hover {
            transform: translateX(-4px);
        }

        /* 내비게이션 탭 메뉴 */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        body.light-mode .nav-tabs {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .nav-tabs {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-tab {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body.light-mode .nav-tab {
            color: #1e90ff;
            background: rgba(30, 144, 255, 0.1);
        }

        body.dark-mode .nav-tab {
            color: #4db8ff;
            background: rgba(77, 184, 255, 0.1);
        }

        .nav-tab:hover {
            transform: translateY(-2px);
        }

        body.light-mode .nav-tab:hover {
            background: rgba(30, 144, 255, 0.2);
            box-shadow: 0 4px 12px rgba(30, 144, 255, 0.15);
        }

        body.dark-mode .nav-tab:hover {
            background: rgba(77, 184, 255, 0.2);
            box-shadow: 0 4px 12px rgba(77, 184, 255, 0.15);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #1e90ff 0%, #00c853 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(30, 144, 255, 0.4);
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        body.light-mode .chart-card {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.5);
        }

        body.dark-mode .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .chart-card:hover {
            transform: translateY(-4px);
        }

        body.light-mode .chart-card:hover {
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        body.dark-mode .chart-card:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 48px rgba(30, 144, 255, 0.2);
        }

        .chart-card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #1e90ff 0%, #00c853 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        canvas {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            padding-top: 15px;
        }

        body.light-mode .chart-legend {
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .chart-legend {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat-item {
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        body.light-mode .stat-item {
            background: rgba(30, 144, 255, 0.1);
            border: 1px solid rgba(30, 144, 255, 0.2);
        }

        body.dark-mode .stat-item {
            background: rgba(30, 144, 255, 0.1);
            border: 1px solid rgba(30, 144, 255, 0.2);
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.7;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #1e90ff;
        }

        @media (max-width: 1024px) {
            .charts-container {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .charts-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .chart-card {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .theme-toggle {
                top: 20px;
                right: 20px;
            }

            .toggle-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body class="light-mode">
    <div class="theme-toggle">
        <button class="toggle-btn" id="themeToggle" title="테마 전환">🌙</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>📊 매출 분석</h1>
            <a href="index.html" class="back-link">← 메인</a>
        </div>

        <!-- 내비게이션 탭 메뉴 -->
        <div class="nav-tabs">
            <a href="dashboard.html" class="nav-tab">📋 대시보드</a>
            <a href="meeting-result.html" class="nav-tab">📝 회의록</a>
            <a href="chart.html" class="nav-tab active">📈 매출 현황</a>
            <a href="diagram.svg" class="nav-tab">🔄 업무 프로세스</a>
            <a href="report.html" class="nav-tab">📊 사이트 분석</a>
        </div>

        <div class="charts-container">
            <!-- 월별 매출 추이 -->
            <div class="chart-card">
                <h2>📈 월별 매출 추이</h2>
                <canvas id="monthlyChart" width="400" height="300"></canvas>
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #1e90ff;"></div>
                        <span>월별 매출</span>
                    </div>
                </div>
            </div>

            <!-- 제품별 매출 비교 -->
            <div class="chart-card">
                <h2>📊 제품별 매출 비교</h2>
                <canvas id="productChart" width="400" height="300"></canvas>
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #1e90ff;"></div>
                        <span>제품별 합계</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #00c853;"></div>
                        <span>비율</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 통계 -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">총 매출</div>
                <div class="stat-value" id="totalSales">₩0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">평균 거래액</div>
                <div class="stat-value" id="avgSales">₩0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">최고 판매 제품</div>
                <div class="stat-value" id="topProduct">-</div>
            </div>
        </div>
    </div>

    <script>
        // 데이터
        const salesData = [
            { date: '2026-01-05', product: '무선 이어폰', sales: 4005000 },
            { date: '2026-01-05', product: '보조배터리', sales: 1120000 },
            { date: '2026-01-08', product: '무선 이어폰', sales: 4628000 },
            { date: '2026-01-08', product: '블루투스 스피커', sales: 2160000 },
            { date: '2026-01-08', product: '텀블러', sales: 1625000 },
            { date: '2026-01-12', product: '보조배터리', sales: 1435000 },
            { date: '2026-01-12', product: '무선 충전기', sales: 1305000 },
            { date: '2026-01-12', product: '에코백', sales: 1395000 },
            { date: '2026-01-15', product: '무선 이어폰', sales: 3382000 },
            { date: '2026-01-15', product: '블루투스 스피커', sales: 2640000 },
            { date: '2026-01-15', product: '텀블러', sales: 2100000 },
            { date: '2026-01-19', product: '보조배터리', sales: 1925000 },
            { date: '2026-01-19', product: '에코백', sales: 1650000 },
            { date: '2026-01-19', product: '무선 충전기', sales: 1485000 },
            { date: '2026-01-22', product: '무선 이어폰', sales: 5429000 },
            { date: '2026-01-22', product: '텀블러', sales: 1800000 },
            { date: '2026-01-22', product: '블루투스 스피커', sales: 1800000 },
            { date: '2026-01-26', product: '보조배터리', sales: 1680000 },
            { date: '2026-01-26', product: '에코백', sales: 1320000 },
            { date: '2026-01-26', product: '무선 충전기', sales: 1665000 },
            { date: '2026-02-01', product: '무선 이어폰', sales: 6230000 },
            { date: '2026-02-01', product: '텀블러', sales: 2375000 },
            { date: '2026-02-01', product: '보조배터리', sales: 1505000 },
            { date: '2026-02-05', product: '블루투스 스피커', sales: 3000000 },
            { date: '2026-02-05', product: '에코백', sales: 1800000 },
            { date: '2026-02-05', product: '무선 충전기', sales: 1395000 },
            { date: '2026-02-10', product: '무선 이어폰', sales: 5162000 },
            { date: '2026-02-10', product: '텀블러', sales: 1675000 },
            { date: '2026-02-10', product: '보조배터리', sales: 1365000 }
        ];

        // 월별 매출 계산
        function calculateMonthlySales() {
            const monthly = {};
            salesData.forEach(item => {
                const month = item.date.substring(0, 7);
                monthly[month] = (monthly[month] || 0) + item.sales;
            });
            return monthly;
        }

        // 제품별 매출 계산
        function calculateProductSales() {
            const products = {};
            salesData.forEach(item => {
                products[item.product] = (products[item.product] || 0) + item.sales;
            });
            return products;
        }

        // 숫자에 쉼표 추가
        function formatNumber(num) {
            return num.toLocaleString('ko-KR');
        }

        // 월별 매출 차트 그리기
        function drawMonthlyChart() {
            const canvas = document.getElementById('monthlyChart');
            const ctx = canvas.getContext('2d');
            const monthly = calculateMonthlySales();

            const months = Object.keys(monthly).sort();
            const sales = months.map(m => monthly[m]);

            const padding = 60;
            const width = canvas.width - 2 * padding;
            const height = canvas.height - 2 * padding;
            const maxSales = Math.max(...sales);

            // 배경
            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 축
            ctx.strokeStyle = getComputedStyle(document.body).color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, canvas.height - padding);
            ctx.lineTo(canvas.width - padding, canvas.height - padding);
            ctx.stroke();

            // 그리드 라인
            ctx.strokeStyle = '#ddd';
            ctx.globalAlpha = 0.3;
            for (let i = 0; i <= 5; i++) {
                const y = padding + (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // 데이터 포인트와 선
            const pointSpacing = width / (months.length - 1);
            const points = [];

            sales.forEach((sale, i) => {
                const x = padding + pointSpacing * i;
                const y = canvas.height - padding - (sale / maxSales) * height;
                points.push({ x, y });
            });

            // 선 그리기
            ctx.strokeStyle = '#1e90ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();

            // 포인트 그리기
            ctx.fillStyle = '#1e90ff';
            points.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 6, 0, 2 * Math.PI);
                ctx.fill();
            });

            // 레이블
            ctx.fillStyle = getComputedStyle(document.body).color;
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            months.forEach((month, i) => {
                const x = padding + pointSpacing * i;
                ctx.fillText(month, x, canvas.height - padding + 25);
            });

            // Y축 레이블
            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const value = Math.round((maxSales / 5) * i);
                const y = canvas.height - padding - (height / 5) * i;
                ctx.fillText('₩' + formatNumber(value), padding - 10, y + 5);
            }
        }

        // 제품별 차트 그리기
        function drawProductChart() {
            const canvas = document.getElementById('productChart');
            const ctx = canvas.getContext('2d');
            const products = calculateProductSales();

            const names = Object.keys(products).sort((a, b) => products[b] - products[a]);
            const values = names.map(name => products[name]);
            const totalSales = values.reduce((a, b) => a + b, 0);

            const padding = 60;
            const width = canvas.width - 2 * padding;
            const height = canvas.height - 2 * padding;
            const maxValue = Math.max(...values);

            // 배경
            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 축
            ctx.strokeStyle = getComputedStyle(document.body).color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, canvas.height - padding);
            ctx.lineTo(canvas.width - padding, canvas.height - padding);
            ctx.stroke();

            // 그리드 라인
            ctx.strokeStyle = '#ddd';
            ctx.globalAlpha = 0.3;
            for (let i = 0; i <= 5; i++) {
                const y = padding + (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // 막대 그리기
            const barSpacing = width / names.length;
            const barWidth = barSpacing * 0.6;
            const colors = ['#1e90ff', '#00c853', '#ff6f00', '#f50057', '#00bcd4', '#9c27b0'];

            names.forEach((name, i) => {
                const x = padding + barSpacing * (i + 0.5) - barWidth / 2;
                const barHeight = (values[i] / maxValue) * height;
                const y = canvas.height - padding - barHeight;

                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(x, y, barWidth, barHeight);
            });

            // 레이블
            ctx.fillStyle = getComputedStyle(document.body).color;
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            names.forEach((name, i) => {
                const x = padding + barSpacing * (i + 0.5);
                ctx.save();
                ctx.translate(x, canvas.height - padding + 10);
                ctx.rotate(-Math.PI / 4);
                ctx.fillText(name, 0, 0);
                ctx.restore();
            });

            // Y축 레이블
            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const value = Math.round((maxValue / 5) * i);
                const y = canvas.height - padding - (height / 5) * i;
                ctx.fillText('₩' + formatNumber(value), padding - 10, y + 5);
            }
        }

        // 통계 표시
        function displayStats() {
            const monthly = calculateMonthlySales();
            const products = calculateProductSales();

            const totalSales = Object.values(monthly).reduce((a, b) => a + b, 0);
            const avgSales = Math.round(totalSales / salesData.length);
            const topProduct = Object.entries(products).sort((a, b) => b[1] - a[1])[0][0];

            document.getElementById('totalSales').textContent = '₩' + formatNumber(totalSales);
            document.getElementById('avgSales').textContent = '₩' + formatNumber(avgSales);
            document.getElementById('topProduct').textContent = topProduct;
        }

        // 테마 토글
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme') || 'light-mode';
        body.className = savedTheme;
        updateToggleIcon();

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark-mode');
            } else {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                localStorage.setItem('theme', 'light-mode');
            }
            updateToggleIcon();
            redrawCharts();
        });

        function updateToggleIcon() {
            themeToggle.textContent = body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }

        function redrawCharts() {
            drawMonthlyChart();
            drawProductChart();
        }

        // 초기화
        window.addEventListener('load', () => {
            drawMonthlyChart();
            drawProductChart();
            displayStats();
        });

        // 리사이징 처리
        window.addEventListener('resize', () => {
            redrawCharts();
        });
    </script>
</body>
</html>
