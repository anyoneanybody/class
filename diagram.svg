<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">

  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="200" fill="#f8fafc" rx="0"/>

  <!--
    레이아웃 계산 (800px 기준)
    박스 5개 × 120px = 600px
    화살표 4개 × 40px = 160px
    좌우 여백: (800 - 760) / 2 = 20px
    박스 y=55, h=90, 중심y=100
  -->

  <!-- 화살표 1: 기획 → 제작 -->
  <line x1="142" y1="100" x2="175" y2="100" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 화살표 2: 제작 → 검토 -->
  <line x1="302" y1="100" x2="335" y2="100" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 화살표 3: 검토 → 배포 -->
  <line x1="462" y1="100" x2="495" y2="100" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 화살표 4: 배포 → 분석 -->
  <line x1="622" y1="100" x2="655" y2="100" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 단계 1: 기획 (파스텔 핑크) — x=20, w=120 -->
  <rect x="20" y="55" width="120" height="90" rx="16" fill="#ffd6e0" stroke="#ffaac5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="92" text-anchor="middle" font-size="22" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">💡</text>
  <text x="80" y="126" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="15" font-weight="700" fill="#9d174d">기획</text>

  <!-- 단계 2: 제작 (파스텔 주황) — x=180, w=120 -->
  <rect x="180" y="55" width="120" height="90" rx="16" fill="#ffe5c0" stroke="#ffcc80" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="92" text-anchor="middle" font-size="22" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🔨</text>
  <text x="240" y="126" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="15" font-weight="700" fill="#92400e">제작</text>

  <!-- 단계 3: 검토 (파스텔 노랑) — x=340, w=120 -->
  <rect x="340" y="55" width="120" height="90" rx="16" fill="#fef9c3" stroke="#fde047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="92" text-anchor="middle" font-size="22" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🔍</text>
  <text x="400" y="126" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="15" font-weight="700" fill="#854d0e">검토</text>

  <!-- 단계 4: 배포 (파스텔 초록) — x=500, w=120 -->
  <rect x="500" y="55" width="120" height="90" rx="16" fill="#bbf7d0" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="92" text-anchor="middle" font-size="22" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🚀</text>
  <text x="560" y="126" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="15" font-weight="700" fill="#065f46">배포</text>

  <!-- 단계 5: 분석 (파스텔 파랑) — x=660, w=120 -->
  <rect x="660" y="55" width="120" height="90" rx="16" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="92" text-anchor="middle" font-size="22" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">📊</text>
  <text x="720" y="126" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="15" font-weight="700" fill="#1e40af">분석</text>

</svg>
